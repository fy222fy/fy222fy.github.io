# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

first_name: Haonan
last_name: Feng
email: fenghaonan222@gmail.com
keywords: Haonan Feng, 冯皓楠, AI for Security, AI Security, Formal Analysis, Formal Verification, Privacy Computing, BUPT
icon: icon.png # browser tab icon, a file in assets/img/

url: https://fy222fy.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave blank for root

# Feed (jekyll-feed)
title: Haonan Feng
description: Haonan Feng (冯皓楠), Ph.D. student at the School of Cyberspace Security, BUPT.

# Profiles linked from the home page and the footer
github_username: fy222fy
orcid_id: 0009-0002-0140-8342
scholar_userid: ruPrB9wAAAAJ

# -----------------------------------------------------------------------------
# Previews on social media and search engines
# -----------------------------------------------------------------------------

serve_og_meta: true # Open Graph tags
serve_schema_org: true # Schema.org description of the site owner, on the home page
og_image: https://fy222fy.github.io/assets/img/prof_pic.jpg

# -----------------------------------------------------------------------------
# Languages (jekyll-polyglot)
# -----------------------------------------------------------------------------

languages: ["en-us", "zh-cn"]
default_lang: "en-us"
exclude_from_localization: ["assets"]
lang_from_path: true
parallel_localization: false

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

permalink: /blog/:year/:title/

jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: archive
    tag: archive
    category: archive
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"

# Categories listed at the top of the blog page, in this order
display_categories: ["learn", "c++", "ai", "security"]

# Comments under posts (https://giscus.app). Leave `repo` empty to turn comments off.
giscus:
  repo: # <github-user>/<repo>
  repo_id:
  category: Comments
  category_id:
  mapping: title

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    output: false # news items are one-liners shown on the home page and on /news/

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

include: ["_pages"]
exclude:
  - bin/
  - docs/ # redesign notes and design sources, not part of the site
  - CLAUDE.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - INSTALL.md
  - UPGRADING.md
  - lighthouse_results/
  - readme_preview/
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - link-report.md
  - node_modules/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - vendor
  # photos that are not used on the site
  - assets/img/prof_pic_color.png
  - assets/img/prof_pic_old.jpg
  - assets/json/table_data.json
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-polyglot
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true

sass:
  sourcemap: never
  style: compressed
  quiet_deps: true

jekyll-minifier:
  exclude: ["robots.txt"]
  # Sass already compresses the style sheet; the minifier would break expressions such as clamp(1rem, 0.5rem + 2vw, 3rem)
  compress_css: false

# Table of contents of posts (jekyll-toc)
toc:
  min_level: 1
  max_level: 3
  list_class: toc__list

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  # how the site owner is written in author lists, so that the name can be emphasized
  last_name: [Feng, 冯皓楠]
  first_name: [Haonan, H.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  query: "@*"
  sort_by: year,month,day
  order: descending
  group_by: year
  group_order: descending
  bibliography_group_tag: h3
  # fields used by this site only, left out of the BibTeX shown to visitors
  bibtex_skip_fields:
    [
      abbr,
      abstract,
      additional_info,
      assession_number,
      code,
      day,
      dimensions,
      google_scholar_id,
      html,
      if,
      kind,
      nationality,
      pdf,
      sci_index_date,
      selected,
      video,
      where,
    ]

# -----------------------------------------------------------------------------
# Links to other websites open in a new tab (jekyll-link-attributes)
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive images (jekyll-imagemagick). Needs ImageMagick: `convert -version`.
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
    - assets/posts/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-quality 85"

lazy_loading_images: true

# -----------------------------------------------------------------------------
# CV data (jekyll-get-json). The files use the JSON Resume format.
# -----------------------------------------------------------------------------

jekyll_get_json:
  - data: resume_en-us
    json: assets/json/resume_en-us.json
  - data: resume_zh-cn
    json: assets/json/resume_zh-cn.json

research:
  title: 研究方向
  items:
    - title: AI for Security（AI 安全）
      text: 用 AI 辅助网络安全，尤其是形式化分析相关领域，例如用大模型实现形式化建模与协议验证的自动化。
    - title: 形式化分析
      text: 基于严格的数学方法，验证通信系统的安全性，以及 AI 与智能体之间协作的安全性。
    - title: 隐私计算
      text: 可信执行环境（TEE）、多方安全计算（MPC）与联邦学习，以及它们在大模型训练与推理中的应用。


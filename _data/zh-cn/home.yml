research:
  title: 研究方向
  items:
    - title: 大模型安全
      text: 大模型与多智能体系统的安全，以及对人工智能群体交互的形式化推理。
    - title: 大模型 for 安全
      text: 用大模型辅助安全分析，尤其是自动化的形式化建模与协议验证。
    - title: 形式化分析
      text: 基于 ProVerif 与应用 π 演算的协议验证、最小化假设分析，以及设备内进程间通信的建模。


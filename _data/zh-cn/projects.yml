featured:
  anchor: fido-uaf
  tag: 科研 · 自然基金项目
  period: 2018.09 – 2020.03
  title: FIDO UAF 协议的形式化分析
  text: FIDO UAF 用生物特征认证取代口令，但此前缺少全面的安全分析。本项目提出了一套分析此类协议的通用形式化方法，并开发了将其自动化的开源工具。
  work:
    - 从 500+ 页标准中提炼 UAF 的安全目标与安全假设，对隐私性、认证性、不可链接性建模。
    - 提出设备内进程间通信的建模方式，区别于网络协议的建模方式。
    - 提出最小化假设分析方法，开发并开源验证工具 UAFVerif，验证 40 万+ 应用场景。
    - 发现并分类 4 类攻击，覆盖全部已知攻击，并给出协议安全所需的最小假设。
    - 分析 1856 款支付相关 APP：42 款使用 UAF 的 APP 存在 2 类隐患，并在其中 2 款上实现任意金额划转攻击。
    - 发现 ProVerif 验证工具的漏洞并贡献修复。
  stats:
    - figure: "500+"
      text: 页 FIDO 标准文档完成形式化
    - figure: 40 万+
      text: 个协议场景自动验证
    - figure: "4"
      text: 类攻击，覆盖全部已知攻击
    - figure: "1856"
      text: 款支付类 APP 分析，42 款存在隐患
  outcomes: NDSS 2021 · IEEE TDSC · CNNVD-202005-1219（中危）· InForSec 2022 报告 · 书章
  links:
    - label: NDSS 2021 论文
      url: /publications/#feng2021formal
    - label: IEEE TDSC 论文
      url: /publications/#feng2022fido
    - label: UAFVerif（GitHub）
      url: https://github.com/CactiLab/UAFVerif

ant:
  title: 蚂蚁集团
  meta: 2021 – 2024 · 网络安全工程师
  items:
    - anchor: tee-llm
      tag: 产品研发 + 科研
      period: 2024.02 – 2024.05
      title: TEE 密态大模型推理
      text: 隐语 Cloud 大模型密算平台（2024）把模型部署在可信执行环境中，模型和用户的查询都不会暴露给托管平台。
      work:
        - 基于 TEE 远程认证，设计用户平台与云端 TEE 之间的身份验证、密钥生成与加密传输流程。
        - 借助蚂蚁开源的 TEE 操作系统 Occlum，在 SGX、HyperEnclave 中部署大模型。
        - 参与平台研发：查询在平台侧加密上云，在 TEE 内解密计算，结果加密返回。
    - anchor: fl-llm
      tag: 产品研发 + 科研
      period: 2024.02 – 2024.05
      title: 基于联邦学习的多机构大模型联合训练与微调
      text: 多机构联合训练或微调大模型时，模型提供方和数据提供方都需要强隐私保护。
      work:
        - 设计适用于大模型训练和微调的联邦学习架构。
        - 用 Accelerate、DeepSpeed、PyTorch 完成联邦大模型微调的实验验证，评估性能与可用性。
    - anchor: fl-autoattack
      tag: 隐语开源
      period: 2023.06 – 2024.03
      title: 隐语联邦学习自动攻防框架
      text: 联邦学习的攻防算法很多，但难以在实践中应用。
      work:
        - 设计自动攻防框架，基于 Ray 实现分布式超参遍历（1 项专利）。
        - 实现主流机器学习模型与前沿攻防算法，产出不同模型和场景下的业界基准。
        - 在隐语开源，通过 B 站直播推广，并推广到 3 所高校。
    - anchor: tecc
      tag: 产品研发 + 算法
      period: 2022.01 – 2023.06
      title: 可信密态计算系统 TECC
      text: 多个异构 TEE 在同一局域网内结合 MPC 运行：比公网上的 MPC 更快，比单一 TEE 更安全。
      work:
        - 对比多种 MPC 算法后，证明 ABY3 半诚实算法在恶意模型下的隐私安全。
        - 实现 ABY3 算子，并优化向量异或、矩阵点乘、排序（4 项专利）。
        - 适配 SGX 与 HyperEnclave，完成云上部署，接入 1 项业务。
    - anchor: oceanbase-lob
      tag: 产品研发
      period: 2021.06 – 2021.09
      title: OceanBase 大对象存储
      text: OceanBase 的 LSM-tree 架构原本不支持大对象（LOB），且各副本存储的物理地址不同。
      work:
        - LOB 数据插入、更新时实时落盘。
        - 设计虚拟文件系统，对数据库层屏蔽物理地址，保证多副本强一致。
        - 采用分级索引，支持 TB 级 LOB 存储。
  outputs:
    title: 在蚂蚁集团的产出
    items:
      - figure: "5"
        unit: 项
        text: 发明专利，涉及多方安全计算与分布式计算
      - figure: "1"
        unit: 项
        text: 软件著作权：蚂蚁可信密态计算引擎系统（2022SR1504853）
      - figure: "1"
        unit: 项
        text: 信通院多方安全计算安全评测证书：可信密态计算系统（IY2022102700）
      - figure: "1"
        unit: 部
        text: 《可信密态计算白皮书》，参与撰写
      - figure: "1"
        unit: 个
        text: 隐语开源框架


featured:
  anchor: fido-uaf
  tag: 自然基金科研项目
  period: 2018.09 – 2020.03
  title: FIDO UAF 协议的形式化分析
  work:
    - "从 500+ 页标准提炼安全目标与假设，对隐私性、认证性、不可链接性建模"
    - "提出设备内进程间通信的建模方式"
    - "提出最小化假设分析方法，开发并开源 UAFVerif，验证 40 万+ 应用场景"
    - "发现并分类 4 类攻击，覆盖全部已知攻击"
    - "分析 1856 款支付相关 APP，其中 42 款使用 UAF 的 APP 存在 2 类隐患，在 2 款 APP 上实现任意金额划转攻击"
    - "获 CNNVD 中危漏洞"
    - "发现 ProVerif 漏洞并贡献修复"
  stats:
    - figure: "500+"
      text: 页标准
    - figure: 40 万+
      text: 应用场景
    - figure: "4"
      text: 类攻击，覆盖全部已知攻击
    - figure: "1856"
      text: 款支付相关 APP
  outcomes: "NDSS / IEEE TDSC 论文，InForSec 2022 报告，书章"
  links:

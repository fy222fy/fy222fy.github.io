# 文字来源：docs/redesign/README.md 第 4.2 节。

intro: 科研、工业界与开源项目：从认证协议的形式化验证，到大模型的密态计算。

featured:
  anchor: fido-uaf
  tag: 科研 · 国家自然科学基金资助
  period: 2018.09 – 2020.03
  title: FIDO UAF 协议的形式化分析
  text: >-
    FIDO UAF 用生物特征认证取代口令，但此前从未被全面地分析过。
    本项目建立了对这类协议进行形式化分析的通用方法，并开源了自动化分析工具。
  work:
    - "从 500 余页标准中提炼 UAF 的安全目标与假设，对隐私性、认证性和不可链接性建模"
    - "提出设备内进程间通信的建模方式，区别于网络协议的建模方式"
    - "提出最小化假设分析方法，开发并开源验证工具 UAFVerif，验证 40 万余个协议场景"
    - "发现并分类 4 类攻击，覆盖全部已知攻击，并给出 UAF 安全所需的最小假设"
    - "分析 1856 款支付相关 APP，其中 42 款使用 UAF 的 APP 存在 2 类隐患，在其中 2 款上实现任意金额划转攻击"
    - "发现 ProVerif 验证工具的漏洞并贡献修复"
  stats:
    - figure: "500+"
      text: 页 FIDO 标准完成形式化
    - figure: 40 万+
      text: 个协议场景完成自动验证
    - figure: "4"
      text: 类攻击，覆盖全部已知攻击
    - figure: "1856"
      text: 款支付类 APP 完成分析，42 款存在隐患
  outcomes: NDSS 2021 · IEEE TDSC · CNNVD-202005-1219（中危）· InForSec 2022 报告 · 书章
  links:
    - label: NDSS 2021 论文
      url: /publications/#feng2021formal
    - label: IEEE TDSC 论文
      url: /publications/#feng2022fido
    - label: UAFVerif（GitHub）
      url: https://github.com/CactiLab/UAFVerif

ant:
  title: 蚂蚁集团
  meta: 2021 – 2024 · 网络安全工程师
  items:
    - anchor: tee-llm
      tag: "产品研发 + 科研"
      period: "2024.02 – 2024.05"
      title: "TEE 密态大模型推理"
      text: 隐语 Cloud 大模型密算平台（2024）把模型部署在可信执行环境中，模型和用户的查询都不会暴露给托管平台。
      work:
        - "基于 TEE 远程认证设计用户平台与云端 TEE 的身份验证、密钥生成与加密传输流程"
        - "借助 Occlum 在 SGX、HyperEnclave 中部署大模型"
        - "参与平台研发，查询加密上云、TEE 内解密计算、结果加密返回"
    - anchor: fl-llm
      tag: "产品研发 + 科研"
      period: "2024.02 – 2024.05"
      title: "基于联邦学习的多机构大模型联合训练 / 微调"
      text: 多个机构联合训练或微调大模型，模型提供方和数据提供方都需要很强的隐私保障。
      work:
        - "设计适用于大模型训练和微调的联邦学习架构"
        - "用 Accelerate、DeepSpeed、PyTorch 完成实验验证"
    - anchor: fl-autoattack
      tag: "开源"
      period: "2023.06 – 2024.03"
      title: "隐语联邦学习自动攻防框架"
      text: 联邦学习的攻防算法很多，但在实际场景中很难用起来。
      work:
        - "基于 Ray 的分布式超参遍历（1 项专利）"
        - "实现主流模型与前沿攻防算法，产出业界基准"
        - "在隐语开源，B 站直播推广，推广到 3 所高校"
    - anchor: tecc
      tag: "产品研发 + 算法"
      period: "2022.01 – 2023.06"
      title: "可信密态计算系统 TECC"
      text: 多个异构 TEE 与 MPC 在同一局域网内协同运行：比公网上的 MPC 更快，比单一 TEE 更安全。
      work:
        - "证明 ABY3 半诚实算法在恶意模型下的隐私安全"
        - "实现 ABY3 算子并优化向量异或、矩阵点乘、排序（4 项专利）"
        - "适配 SGX、HyperEnclave，云上部署，接入 1 项业务"
        - "入选第五届数字中国建设峰会“十大硬核科技”"
    - anchor: oceanbase-lob
      tag: "产品研发"
      period: "2021.06 – 2021.09"
      title: "OceanBase 大对象存储"
      text: OceanBase 的 LSM-tree 架构原本不支持大对象（LOB），而且大对象在各副本中的物理地址不同。
      work:
        - "LOB 数据插入 / 更新时实时落盘"
        - "设计虚拟文件系统屏蔽物理地址，保证多副本强一致"
        - "分级索引支持 TB 级 LOB"
  outputs:
    title: 蚂蚁集团期间的产出
    items:
      - figure: "5"
        text: 多方安全计算与分布式计算方向的发明专利
      - figure: "1"
        text: 软件著作权：蚂蚁可信密态计算引擎系统（2022SR1504853）
      - figure: "1"
        text: 信通院多方安全计算安全评测证书：可信密态计算系统（IY2022102700）
      - figure: "1"
        text: 参与撰写《可信密态计算白皮书》
      - figure: "1"
        text: 隐语开源框架


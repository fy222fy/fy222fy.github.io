research:
  title: Research Interests
  items:
    - title: AI for Security
      text: >-
        Using AI to assist cybersecurity, especially formal analysis, for example using large language models
        to automate formal modeling and protocol verification.
    - title: Formal Analysis
      text: >-
        Using rigorous mathematical methods to verify the security of communication systems
        and of collaboration among AI agents.
    - title: Privacy Computing
      text: >-
        Trusted execution environments (TEE), secure multi-party computation (MPC) and federated learning,
        and their use in training and inference of large models.


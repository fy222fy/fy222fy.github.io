intro: >-
  Research, industry and open-source work, from verifying authentication protocols
  to confidential computing for large models.

featured:
  anchor: fido-uaf
  tag: Research · NSFC-funded
  period: 2018.09 – 2020.03
  title: Formal Analysis of the FIDO UAF Protocol
  text: >-
    FIDO UAF replaces passwords with biometric authentication, but had never been analyzed comprehensively.
    This project built a general method for formally analyzing such protocols, and an open-source tool that automates it.
  work:
    - >-
      Extracted the security goals and assumptions of UAF from 500+ pages of standards,
      and modeled confidentiality, authentication and unlinkability.
    - >-
      Proposed a way to model inter-process communication inside a device,
      distinct from how network protocols are modeled.
    - >-
      Proposed a minimal-assumption analysis method and built the open-source verifier UAFVerif,
      verifying 400,000+ protocol scenarios.
    - >-
      Found and classified 4 classes of attacks covering all known attacks,
      and the minimal assumptions under which UAF is secure.
    - >-
      Analyzed 1,856 payment-related apps: 42 apps using UAF carried 2 classes of risk;
      demonstrated arbitrary-amount transfer attacks on 2 of them.
    - Found a bug in the ProVerif verifier and contributed the fix.
  stats:
    - figure: "500+"
      text: pages of FIDO specifications formalized
    - figure: "400,000+"
      text: protocol scenarios verified automatically
    - figure: "4"
      text: classes of attacks, covering all known ones
    - figure: "1,856"
      text: payment apps analyzed; 42 at risk
  outcomes: NDSS 2021 · IEEE TDSC · CNNVD-202005-1219 (medium) · InForSec 2022 talk · book chapter
  links:
    - label: NDSS 2021 paper
      url: /publications/#feng2021formal
    - label: IEEE TDSC paper
      url: /publications/#feng2022fido
    - label: UAFVerif on GitHub
      url: https://github.com/CactiLab/UAFVerif

ant:
  title: At Ant Group
  meta: 2021 – 2024 · Cybersecurity Engineer
  items:
    - anchor: tee-llm
      tag: Product + research
      period: 2024.02 – 2024.05
      title: Confidential LLM Inference in TEEs
      text: >-
        SecretFlow Cloud (2024) deploys models inside trusted execution environments,
        so that neither the model nor users’ queries are exposed to the hosting platform.
      work:
        - >-
          Designed the authentication flow between the user platform and cloud TEEs,
          and key generation and encrypted transport based on remote attestation.
        - Deployed LLMs in SGX and HyperEnclave with Occlum, Ant Group’s open-source TEE OS.
        - >-
          Built the path in which queries are encrypted on the platform,
          decrypted and computed inside the TEE, and returned encrypted.
    - anchor: fl-llm
      tag: Product + research
      period: 2024.02 – 2024.05
      title: Federated Fine-tuning of LLMs Across Institutions
      text: >-
        Joint training or fine-tuning of large models across institutions,
        where both model providers and data providers need strong privacy guarantees.
      work:
        - Designed a federated-learning architecture for training and fine-tuning large models.
        - >-
          Validated federated LLM fine-tuning with Accelerate, DeepSpeed and PyTorch,
          measuring performance and usability.
    - anchor: fl-autoattack
      tag: Open source · SecretFlow
      period: 2023.06 – 2024.03
      title: Federated Learning AutoAttack
      text: Many attack and defense algorithms exist for federated learning, but they are hard to apply in practice.
      work:
        - Designed an automated attack-and-defense framework that searches hyperparameters with Ray (1 patent).
        - >-
          Implemented mainstream ML models and state-of-the-art attacks and defenses,
          producing benchmarks across models and scenarios.
        - Open-sourced it in SecretFlow, presented it in a Bilibili livestream and promoted it to 3 universities.
    - anchor: tecc
      tag: Product + algorithms
      period: 2022.01 – 2023.06
      title: Trusted-Environment-based Cryptographic Computing (TECC)
      text: >-
        Heterogeneous TEEs run in one LAN together with MPC:
        faster than MPC over public networks, and more secure than a single TEE.
      work:
        - Proved the privacy of the semi-honest ABY3 protocol under a malicious model, after comparing MPC algorithms.
        - Implemented ABY3 operators and optimized vector XOR, matrix dot product and sorting (4 patents).
        - Adapted operators to SGX and HyperEnclave, deployed to the cloud and onboarded 1 business application.
    - anchor: oceanbase-lob
      tag: Product
      period: 2021.06 – 2021.09
      title: Large Object Storage for OceanBase
      text: >-
        OceanBase’s LSM-tree architecture did not support large objects (LOB),
        and replicas store them at different physical addresses.
      work:
        - Flushed LOB data to disk in real time on insert and update.
        - >-
          Designed a virtual file system that hides physical addresses from the database layer,
          keeping replicas strongly consistent.
        - Used tiered indexing to support TB-scale LOB storage.
  outputs:
    title: Outputs at Ant Group
    items:
      - figure: "5"
        text: Chinese invention patents in MPC and distributed computing
      - figure: "1"
        text: "Software copyright: Ant TECC engine system (2022SR1504853)"
      - figure: "1"
        text: CAICT MPC security evaluation certificate for TECC (IY2022102700)
      - figure: "1"
        text: Trusted Encrypted Computing white paper, co-written
      - figure: "1"
        text: Open-source framework in SecretFlow

